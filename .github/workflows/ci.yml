name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      TEST_ENV_FILE: .env.test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fsm_backend_test?schema=public
      ALLOW_DB_SEED: "true"
      JWT_ACCESS_SECRET: test_access_secret_please_change
      JWT_REFRESH_SECRET: test_refresh_secret_please_change
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      METRICS_ENABLED: "false"

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fsm_backend_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Create .env.test for CI
        run: cp .env.test.example .env.test

      - name: Quality checks (types + lint + tests)
        run: npm run check
      - name: Build app
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Dependency vulnerability audit
        if: github.event_name == 'push'
        run: npm run audit:ci
      - name: Build and generate OpenAPI spec
        if: github.event_name == 'push'
        run: npm run openapi:gen
      - name: Upload OpenAPI spec
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          if-no-files-found: error

  infra-lint:
    name: Infrastructure lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Lint GitHub workflows with actionlint
        uses: docker://rhysd/actionlint:1.7.9
        with:
          args: "-color"

  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build --build-arg DATABASE_URL=postgresql://postgres:postgres@localhost:5432/fsm_backend_test?schema=public -t fsm-backend:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: fsm-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-files: /app/package.json,/app/package-lock.json
